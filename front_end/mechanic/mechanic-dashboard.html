<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mechanic Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="mechanic.css">
</head>

<body>

<div class="mechanic-layout">

  <!-- SIDEBAR -->
  <aside class="mechanic-sidebar" id="mechanicSidebar">

    <div class="sidebar-top">

      <div class="sidebar-logo">

        <div class="logo-icon">
          🔧
        </div>

        <div>
          <h2>AutoCare</h2>
          <p>Mechanic Panel</p>
        </div>

      </div>

    </div>

    <nav class="sidebar-nav">

      <a
        href="mechanic-dashboard.html"
        class="active"
      >

        <i class="fa-solid fa-house"></i>
        Dashboard

      </a>

      <a href="active-service.html">

        <i class="fa-solid fa-screwdriver-wrench"></i>
        Active Jobs

      </a>

      <a href="#">

        <i class="fa-solid fa-clock-rotate-left"></i>
        Upcoming Jobs

      </a>

      <a href="mechanic-history.html">

        <i class="fa-solid fa-file-lines"></i>
        Job History

      </a>

      <a href="#">

        <i class="fa-solid fa-star"></i>
        Ratings

      </a>

      <a href="#">

        <i class="fa-solid fa-bell"></i>
        Notifications

      </a>

      <a href="#">

        <i class="fa-solid fa-gear"></i>
        Settings

      </a>

    </nav>

    <button
      id="logoutBtn"
      class="logout-btn"
    >

      Logout

    </button>
  </aside>
  
  <button id="menuToggle" class="menu-toggle">
      <i class="fa-solid fa-bars"></i>
  </button>

  <!-- MAIN -->
  <main class="mechanic-main">

    <!-- HEADER -->
    <header class="dashboard-header">

      <div class="header-left">

    

        <div>

          <h1>

            Dashboard

          </h1>

          <p>

            Welcome back mechanic 👋

          </p>

        </div>

      </div>

      <div class="header-right">

        <div class="notification-bell">

          🔔

        </div>

      </div>

    </header>

    <!-- STATS -->
    <section class="stats-grid">

      <div class="stat-card">

        <div class="stat-icon blue">
          🔧
        </div>

        <div>

          <h2 id="activeJobsCount">
            0
          </h2>

          <p>
            Active Jobs
          </p>

        </div>

      </div>

      <div class="stat-card">

        <div class="stat-icon orange">
          📅
        </div>

        <div>

          <h2 id="upcomingJobsCount">
            0
          </h2>

          <p>
            Upcoming Jobs
          </p>

        </div>

      </div>

      <div class="stat-card">

        <div class="stat-icon green">
          ✅
        </div>

        <div>

          <h2 id="completedJobsCount">
            0
          </h2>

          <p>
            Completed
          </p>

        </div>

      </div>

      <div class="stat-card">

        <div class="stat-icon purple">
          ⭐
        </div>

        <div>

          <h2>
            4.8
          </h2>

          <p>
            Rating
          </p>

        </div>

      </div>

    </section>

    <!-- JOB SECTION -->
    <section class="jobs-grid">

      <!-- ACTIVE -->
      <div class="dashboard-card">

        <div class="card-header">

          <h3>
            Current Active Jobs
          </h3>

          <a href="#">
            View All
          </a>

        </div>

        <div id="activeJobsList">

        </div>

      </div>

      <!-- UPCOMING -->
      <div class="dashboard-card">

        <div class="card-header">

          <h3>
            Upcoming Assigned Jobs
          </h3>

          <a href="#">
            View All
          </a>

        </div>

        <div id="upcomingJobsList">

        </div>

      </div>

    </section>

  </main>

</div>

<script type="module" src="mechanic-dashboard.js"></script>

</body>
</html>
